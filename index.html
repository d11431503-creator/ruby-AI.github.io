<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人工作台導航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .nav-link {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(79, 70, 229, 0.1);
        }

        .nav-link:hover {
            transform: translateY(-8px);
            background-color: white;
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.2);
            border-color: rgba(79, 70, 229, 0.4);
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            font-size: 1.5rem;
        }

        /* 進場動畫 */
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="max-w-4xl w-full px-6 fade-in">
        <div class="glass-card p-10 md:p-16 text-center">
            <header class="mb-12">
                <h1 class="text-4xl font-bold text-gray-800 mb-4 tracking-tight">數位工作台</h1>
                <p class="text-gray-500 font-light">請選擇您要開啟的工具檔案</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- 按鈕 1: 五子棋 -->
                <a href="五子棋.html" class="nav-link bg-white/50 p-8 rounded-2xl flex flex-col items-center">
                    <div class="icon-circle shadow-lg">
                        <i class="fa-solid fa-chess-board"></i>
                    </div>
                    <span class="text-lg font-medium text-gray-700">五子棋遊戲</span>
                    <span class="text-xs text-gray-400 mt-2 font-light">五子棋.html</span>
                </a>

                <!-- 按鈕 2: 地圖 -->
                <a href="地圖.html" class="nav-link bg-white/50 p-8 rounded-2xl flex flex-col items-center">
                    <div class="icon-circle shadow-lg" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </div>
                    <span class="text-lg font-medium text-gray-700">Ubike 地圖</span>
                    <span class="text-xs text-gray-400 mt-2 font-light">地圖.html</span>
                </a>

                <!-- 按鈕 3: 修圖工具 -->
                <a href="修圖工具一恭03李綺珍.html" class="nav-link bg-white/50 p-8 rounded-2xl flex flex-col items-center">
                    <div class="icon-circle shadow-lg" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <span class="text-lg font-medium text-gray-700">修圖工具</span>
                    <span class="text-xs text-gray-400 mt-2 font-light">一恭03李綺珍</span>
                </a>
            </div>

            <footer class="mt-16 text-gray-400 text-sm font-light">
                提示：請確保 HTML 檔案與此導覽頁放在同一個資料夾內。
            </footer>
        </div>
    </div>

    <script>
        // 簡單的點擊回饋效果
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                console.log('正在嘗試開啟：' + link.getAttribute('href'));
            });
        });
    </script>
</body>
</html>

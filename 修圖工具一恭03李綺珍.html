<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 數位影像工作坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sidebar-width: 320px;
            --bg-color: #f8fafc;
            --panel-color: #ffffff;
            --accent-color: #3b82f6;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .main-container {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--panel-color);
            border-right: 1px solid #e2e8f0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.02);
            z-index: 10;
            overflow-y: auto;
        }

        .canvas-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-image: 
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            overflow: auto;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background-color: white;
            transition: transform 0.2s ease;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-color);
            cursor: pointer;
            border-radius: 50%;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
            cursor: pointer;
        }

        .btn-outline {
            border: 1px solid #e2e8f0;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
            cursor: pointer;
        }

        .btn-active {
            background-color: var(--accent-color) !important;
            color: white !important;
            border-color: var(--accent-color) !important;
        }

        .btn-outline:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 12px;
            margin-top: 24px;
        }

        .input-text {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.875rem;
            outline: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <aside class="sidebar">
        <div class="mb-6">
            <h1 class="text-xl font-bold text-slate-800">AI 數位影像工作坊</h1>
            <p class="text-sm text-slate-500">Professional Studio v1.8</p>
        </div>

        <div class="flex flex-col gap-3">
            <label class="btn-primary">
                上傳圖片
                <input type="file" id="imageInput" accept="image/*" class="hidden">
            </label>
            <div class="grid grid-cols-2 gap-2">
                <button id="undoBtn" class="btn-outline text-sm" disabled>復原 (Undo)</button>
                <button id="downloadBtn" class="btn-outline text-sm">下載 PNG</button>
            </div>
        </div>

        <hr class="my-4 border-slate-100">

        <h3 class="section-title">構圖與變換</h3>
        <div class="grid grid-cols-2 gap-2">
            <button id="rotateBtn" class="btn-outline text-sm">旋轉 90°</button>
            <button id="flipBtn" class="btn-outline text-sm">水平翻轉</button>
        </div>

        <h3 class="section-title">快速濾鏡</h3>
        <div class="grid grid-cols-2 gap-2">
            <button id="grayBtn" class="btn-outline text-sm">灰階</button>
            <button id="invertBtn" class="btn-outline text-sm">負片</button>
            <button id="resetBtn" class="btn-outline text-sm col-span-2 text-red-500 border-red-100 font-bold">智慧重置 (Reset)</button>
        </div>

        <h3 class="section-title">影像調整</h3>
        <div class="bg-slate-50 p-4 rounded-xl flex flex-col gap-4">
            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-medium text-slate-700">亮度 (Brightness)</label>
                    <span id="brightVal" class="text-xs text-slate-400">100%</span>
                </div>
                <input type="range" id="brightRange" min="0" max="200" value="100">
            </div>
            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-medium text-slate-700">對比度 (Contrast)</label>
                    <span id="contrastVal" class="text-xs text-slate-400">100%</span>
                </div>
                <input type="range" id="contrastRange" min="0" max="200" value="100">
            </div>
        </div>

        <h3 class="section-title">文字浮水印</h3>
        <div class="bg-slate-50 p-4 rounded-xl flex flex-col gap-3">
            <input type="text" id="watermarkText" class="input-text" placeholder="輸入浮水印文字...">
            <button id="addWatermarkBtn" class="btn-primary text-sm py-2">添加浮水印</button>
        </div>
    </aside>

    <main class="canvas-area">
        <div id="dropZone" class="w-full h-full flex items-center justify-center">
            <canvas id="mainCanvas"></canvas>
            <div id="emptyState" class="text-center text-slate-400">
                <svg class="mx-auto h-12 w-12 mb-4 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p>尚未選取圖片</p>
            </div>
        </div>
    </main>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const imageInput = document.getElementById('imageInput');
    const undoBtn = document.getElementById('undoBtn');
    
    const grayBtn = document.getElementById('grayBtn');
    const invertBtn = document.getElementById('invertBtn');
    const resetBtn = document.getElementById('resetBtn');
    const rotateBtn = document.getElementById('rotateBtn');
    const flipBtn = document.getElementById('flipBtn');
    
    const brightRange = document.getElementById('brightRange');
    const brightValText = document.getElementById('brightVal');
    const contrastRange = document.getElementById('contrastRange');
    const contrastValText = document.getElementById('contrastVal');
    const watermarkText = document.getElementById('watermarkText');
    const addWatermarkBtn = document.getElementById('addWatermarkBtn');

    let originalImage = null;
    // 歷史堆疊現在儲存物件 { data: ImageData, type: 'brightness'|'contrast'|'filter'|'transform'|'initial' }
    let historyStack = [];
    const MAX_HISTORY = 30;

    let filterStatus = { gray: false, invert: false };

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                originalImage = img;
                historyStack = [];
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                saveHistory('initial');
                document.getElementById('emptyState').style.display = 'none';
                canvas.style.display = 'block';
                resetControlsUI();
                resetFilterUI();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function saveHistory(type) {
        if (historyStack.length >= MAX_HISTORY) {
            historyStack.shift();
        }
        historyStack.push({
            data: ctx.getImageData(0, 0, canvas.width, canvas.height),
            type: type
        });
        updateUndoButton();
    }

    function updateUndoButton() {
        undoBtn.disabled = historyStack.length <= 1;
    }

    /**
     * 精確復原邏輯
     */
    undoBtn.addEventListener('click', () => {
        if (historyStack.length > 1) {
            // 彈出目前的狀態
            const currentState = historyStack.pop();
            
            // 根據被彈出的狀態類型，將對應的 UI 調回 100%
            if (currentState.type === 'brightness') {
                brightRange.value = 100;
                brightValText.innerText = "100%";
            } else if (currentState.type === 'contrast') {
                contrastRange.value = 100;
                contrastValText.innerText = "100%";
            } else if (currentState.type === 'gray') {
                filterStatus.gray = false;
                grayBtn.classList.remove('btn-active');
            } else if (currentState.type === 'invert') {
                filterStatus.invert = false;
                invertBtn.classList.remove('btn-active');
            }

            // 恢復到堆疊頂端的影像
            const previousState = historyStack[historyStack.length - 1];
            canvas.width = previousState.data.width;
            canvas.height = previousState.data.height;
            ctx.putImageData(previousState.data, 0, 0);
            updateUndoButton();
        }
    });

    function applyPixelFilter(filterType, value) {
        if (!originalImage || historyStack.length === 0) return;
        const baseState = historyStack[historyStack.length - 1].data;
        const imageData = new ImageData(new Uint8ClampedArray(baseState.data), baseState.width, baseState.height);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            if (filterType === 'gray') {
                const avg = 0.299 * r + 0.587 * g + 0.114 * b;
                data[i] = data[i+1] = data[i+2] = avg;
            } else if (filterType === 'invert') {
                data[i] = 255 - r; data[i+1] = 255 - g; data[i+2] = 255 - b;
            } else if (filterType === 'brightness') {
                data[i] = r * value; data[i+1] = g * value; data[i+2] = b * value;
            } else if (filterType === 'contrast') {
                data[i] = (r - 128) * value + 128; data[i+1] = (g - 128) * value + 128; data[i+2] = (b - 128) * value + 128;
            }
            data[i] = Math.min(255, Math.max(0, data[i]));
            data[i+1] = Math.min(255, Math.max(0, data[i+1]));
            data[i+2] = Math.min(255, Math.max(0, data[i+2]));
        }
        ctx.putImageData(imageData, 0, 0);
    }

    rotateBtn.addEventListener('click', () => {
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = canvas.height; tempCanvas.height = canvas.width;
        tempCtx.translate(tempCanvas.width/2, tempCanvas.height/2);
        tempCtx.rotate(Math.PI/2);
        tempCtx.drawImage(canvas, -canvas.width/2, -canvas.height/2);
        canvas.width = tempCanvas.width; canvas.height = tempCanvas.height;
        ctx.drawImage(tempCanvas, 0, 0);
        saveHistory('transform');
    });

    flipBtn.addEventListener('click', () => {
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
        tempCtx.translate(canvas.width, 0); tempCtx.scale(-1, 1);
        tempCtx.drawImage(canvas, 0, 0);
        ctx.drawImage(tempCanvas, 0, 0);
        saveHistory('transform');
    });

    grayBtn.addEventListener('click', () => {
        if (!originalImage) return;
        if (filterStatus.gray) {
            undoBtn.click(); // 再次點擊相當於復原
        } else {
            applyPixelFilter('gray', null);
            saveHistory('gray');
            filterStatus.gray = true;
            grayBtn.classList.add('btn-active');
        }
    });

    invertBtn.addEventListener('click', () => {
        if (!originalImage) return;
        if (filterStatus.invert) {
            undoBtn.click();
        } else {
            applyPixelFilter('invert', null);
            saveHistory('invert');
            filterStatus.invert = true;
            invertBtn.classList.add('btn-active');
        }
    });

    brightRange.addEventListener('input', (e) => {
        const val = e.target.value;
        brightValText.innerText = `${val}%`;
        applyPixelFilter('brightness', val / 100);
    });
    brightRange.addEventListener('change', () => saveHistory('brightness'));

    contrastRange.addEventListener('input', (e) => {
        const val = e.target.value;
        contrastValText.innerText = `${val}%`;
        applyPixelFilter('contrast', val / 100);
    });
    contrastRange.addEventListener('change', () => saveHistory('contrast'));

    addWatermarkBtn.addEventListener('click', () => {
        const text = watermarkText.value.trim();
        if (!text) return;
        ctx.font = `bold ${canvas.width/20}px Inter`;
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.textAlign = "right";
        ctx.fillText(text, canvas.width-20, canvas.height-20);
        saveHistory('watermark');
        watermarkText.value = "";
    });

    resetBtn.addEventListener('click', () => {
        if (!originalImage) return;
        canvas.width = originalImage.width;
        canvas.height = originalImage.height;
        ctx.drawImage(originalImage, 0, 0);
        historyStack = [];
        saveHistory('initial');
        resetControlsUI();
        resetFilterUI();
    });

    function resetControlsUI() {
        brightRange.value = 100; brightValText.innerText = "100%";
        contrastRange.value = 100; contrastValText.innerText = "100%";
    }

    function resetFilterUI() {
        filterStatus.gray = false; filterStatus.invert = false;
        grayBtn.classList.remove('btn-active'); invertBtn.classList.remove('btn-active');
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `Export.png`;
        link.href = canvas.toDataURL();
        link.click();
    });
</script>
</body>
</html>
